<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Silver Pulse 银脉 · 企业库</title>
<style>
/* ===== Silver Pulse 设计系统 v1.0 ===== */
:root{
  --bg:#eef2f7;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --sidebar-bg:#0f172a;
  --sidebar-text:#cbd5e1;
  --sidebar-text-dim:#7c8aa3;
  --sidebar-active:#22d3ee;
  --text:#1e293b;
  --text-secondary:#51607a;
  --text-muted:#8a94a6;
  --border:#e3e8ef;
  --border-strong:#cdd6e3;
  --accent:#0ea5b7;
  --accent-strong:#0c7e8c;
  --accent-light:#e0f7fa;
  --accent-grad:linear-gradient(135deg,#0ea5b7 0%,#0c7e8c 100%);
  --radius:14px;
  --radius-sm:9px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.06);
  --shadow-md:0 4px 14px rgba(15,23,42,.08);
  --shadow-lg:0 10px 30px rgba(15,23,42,.12);
  --tag-bg:#e0f2fe; --tag-text:#0369a1;
  --cat-bg:#ecfdf5; --cat-text:#047857;
  --fund-bg:#fef3c7; --fund-text:#92650e;
  --fund-total-bg:#ecfdf5; --fund-total-text:#166534;
  --good:#16a34a; --warn:#d97706; --bad:#dc2626;
  --maxw:1080px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.62;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh;font-size:14px}

/* ===== Sidebar (固定深色) ===== */
.sidebar{width:212px;background:var(--sidebar-bg);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;
  padding:22px 0 16px;flex-shrink:0;z-index:30;display:flex;flex-direction:column}
.sidebar-logo{padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.sidebar-logo h1{font-size:17px;font-weight:800;color:#fff;letter-spacing:.3px;line-height:1.3}
.sidebar-logo h1 span{background:linear-gradient(135deg,#22d3ee,#34d399);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:11px;color:var(--sidebar-text-dim);margin-top:4px;letter-spacing:.5px}
.nav-section{padding:4px 0;flex:1}
.nav-label{font-size:10px;color:var(--sidebar-text-dim);text-transform:uppercase;letter-spacing:1px;padding:8px 20px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 20px;font-size:13.5px;color:var(--sidebar-text);
  text-decoration:none;cursor:pointer;border-left:3px solid transparent;transition:all .16s;font-weight:500}
.nav-item .nav-ico{font-size:15px;width:18px;text-align:center;opacity:.9}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(34,211,238,.18),transparent);color:#fff;border-left-color:var(--sidebar-active);font-weight:700}
.sidebar-footer{margin-top:auto;padding:14px 20px 0;border-top:1px solid rgba(255,255,255,.08)}
.theme-toggle{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:8px;border-radius:10px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--sidebar-text);
  font-size:12.5px;cursor:pointer;transition:all .16s;font-family:inherit}
.theme-toggle:hover{background:rgba(255,255,255,.12);color:#fff}

/* ===== Main ===== */
.main{flex:1;margin-left:212px;width:calc(100% - 212px);max-width:var(--maxw);padding:30px 38px 70px}
.header{margin-bottom:20px}
.header-top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.header h2{font-size:23px;font-weight:800;letter-spacing:.2px}
.header-stats{font-size:12px;color:var(--text-muted);white-space:nowrap}
.header-signal{font-size:11.5px;color:var(--accent-strong);margin-top:3px;font-weight:600}
.dl-btn{font-size:12px;color:var(--accent-strong);text-decoration:none;border:1px solid var(--accent);
  padding:6px 13px;border-radius:10px;white-space:nowrap;font-weight:600;transition:all .15s;background:#fff}
.dl-btn:hover{background:var(--accent);color:#fff}

/* ===== 顶部工具条（隐藏）===== */
.top-tools{display:none!important}

/* ===== 筛选 / 搜索（首页顶部工具栏） ===== */
.filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.view-pills,.region-pills{display:inline-flex;gap:4px;background:var(--surface);padding:3px;border-radius:20px;box-shadow:var(--shadow-sm)}
.view-pill,.region-pill{padding:6px 15px;border-radius:18px;border:none;background:transparent;cursor:pointer;
  font-size:12.5px;font-weight:600;color:var(--text-secondary);transition:all .15s;white-space:nowrap;font-family:inherit}
.view-pill.active,.region-pill.active{background:var(--accent-grad);color:#fff;box-shadow:var(--shadow-sm)}
.search-inline{padding:7px 12px;border:1px solid var(--border);border-radius:12px;font-size:12.5px;outline:none;
  background:var(--surface);color:var(--text);width:200px;transition:border-color .15s,box-shadow .15s;font-family:inherit}
.search-inline:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,165,183,.12);width:200px}
/* 搜索内联进工具栏(与视图/地区/排序同排), 输入框缩短, 按钮 flex:0 0 auto 常驻不挤压 */
.search-inline-group{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;margin-left:2px}
.search-btn{flex:0 0 auto;padding:7px 16px;border:none;border-radius:12px;background:var(--accent-grad);color:#fff;
  font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
.search-btn:hover{opacity:.9}
.search-clear{display:none;flex:0 0 auto;width:26px;height:26px;border:none;border-radius:50%;background:var(--border);color:var(--text-muted);font-size:16px;cursor:pointer;line-height:1;transition:.15s}
.search-clear:hover{background:#e74c3c;color:#fff}
.search-inline-group.has-text .search-clear{display:flex;align-items:center;justify-content:center}

.ent-loadmore-wrap{display:flex;justify-content:center;margin:28px 0 8px}
.ent-loadmore-btn{padding:11px 28px;border:1px solid var(--border);border-radius:14px;background:var(--surface);
  color:var(--accent);font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.ent-loadmore-btn:hover{background:var(--accent-grad);color:#fff;border-color:transparent}

/* 返回顶部按钮：fixed 右下角，默认隐藏，超过 1 屏才显示 */
.sp-totop{position:fixed;right:22px;bottom:22px;z-index:150;width:44px;height:44px;border:none;border-radius:50%;
  background:var(--accent-grad);color:#fff;font-size:20px;line-height:1;font-weight:700;cursor:pointer;
  box-shadow:0 6px 18px rgba(14,165,183,.35);display:none;align-items:center;justify-content:center;
  transition:opacity .2s,transform .2s;font-family:inherit;opacity:.92}
.sp-totop:hover{opacity:1;transform:translateY(-2px)}
.sp-totop.show{display:flex}
.sp-totop svg{width:20px;height:20px;display:block}

.news-search-row{margin-bottom:16px}
.news-search{width:100%;box-sizing:border-box;padding:11px 17px;border:1.5px solid var(--border);border-radius:14px;
  font-size:13.5px;outline:none;background:var(--surface);color:var(--text);transition:all .15s;font-family:inherit}
.news-search:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(14,165,183,.10)}

.filter-section{background:transparent;border:none;border-radius:0;padding:0;margin-bottom:14px;box-shadow:none}
.filter-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;line-height:1}
.filter-row:last-child{margin-bottom:0}
.filter-label{font-size:11.5px;color:var(--text-muted);width:28px;font-weight:700;letter-spacing:.3px;margin-right:4px;flex-shrink:0;text-align:left}
.filter-btns{display:flex;flex-wrap:wrap;gap:5px;flex:1;justify-content:flex-start;align-items:center}
/* 统一按钮高度 28px */
.filter-btn{padding:4px 13px;border-radius:14px;border:1px solid var(--border);background:var(--surface);
  font-size:12px;cursor:pointer;color:var(--text-secondary);white-space:nowrap;transition:all .15s;font-family:inherit;height:28px;line-height:1;display:inline-flex;align-items:center}
.filter-btn:hover{border-color:var(--accent);color:var(--accent-strong)}
.filter-btn.active{background:var(--accent-grad);color:#fff;border-color:transparent;font-weight:700}
/* 最后一行：时间+辅助按钮，辅助按钮右对齐 */
.filter-row.filter-last{justify-content:flex-start}
.filter-row .aux-group{display:inline-flex;gap:5px;margin-left:auto;flex-shrink:0;align-items:center}
/* 折叠按钮（保留但不再常用） */
.filter-btn-more,.f-btn-more{padding:4px 10px;border-radius:14px;border:1px dashed var(--accent);background:var(--accent-light);
  font-size:11.5px;cursor:pointer;color:var(--accent-strong);white-space:nowrap;transition:all .13s;font-family:inherit;font-weight:600;height:28px;line-height:1;display:inline-flex;align-items:center}
.filter-btn-more:hover,.f-btn-more:hover{background:var(--accent);color:#fff;border-style:solid}
.filter-btn-more.active,.f-btn-more.active{background:var(--accent);color:#fff;border-style:solid}
#more-tags-box{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.ent-more-tags-wrap{display:flex;flex-wrap:wrap;gap:5px}


/* ===== 资讯流卡片 ===== */
.feed-item{display:flex;gap:14px;padding:15px 4px;border-bottom:1px solid var(--border);transition:background .12s}
.feed-item:last-child{border-bottom:none}
.feed-item:hover{background:var(--surface)}
.feed-item.is-selected{background:linear-gradient(90deg,var(--accent-light),transparent);border-left:3px solid var(--accent);padding-left:12px;border-radius:0 8px 8px 0}
.feed-time{flex-shrink:0;width:50px;font-size:12px;font-weight:800;color:var(--text-muted);padding-top:2px;text-align:right}
.feed-body{flex:1;min-width:0}
.feed-meta{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap}
.feed-source{font-size:11.5px;color:var(--text-muted);font-weight:600}
.feed-class{display:flex;align-items:center;gap:4px;margin-bottom:5px;flex-wrap:wrap}
.feed-title{font-size:14.5px;font-weight:700;line-height:1.45;margin-bottom:3px}
.feed-title a{color:var(--text);text-decoration:none}
.feed-title a:hover{color:var(--accent-strong)}
.feed-summary{font-size:12.5px;color:var(--text-secondary);line-height:1.6;margin-bottom:4px}
.feed-rec{font-size:11.5px;color:var(--accent-strong);line-height:1.5;margin-bottom:4px;font-style:italic}
.feed-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;justify-content:flex-start}
.date-group-title{font-size:13px;font-weight:800;color:var(--accent-strong);margin:18px 0 9px;padding-left:11px;border-left:3px solid var(--accent)}

/* ===== 徽章 ===== */
.badge-region{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700}
.badge-region.region-overseas{background:var(--cat-bg);color:var(--cat-text)}
.badge-region.region-domestic{background:#eff6ff;color:#1d4ed8}
.badge-event{font-size:10.5px;padding:2px 9px;border-radius:7px;background:var(--fund-bg);color:var(--fund-text);font-weight:700}
.badge-domain{font-size:10.5px;padding:2px 9px;border-radius:7px;background:var(--surface-2);color:var(--text-secondary);font-weight:600;border:1px solid var(--border)}
.badge-tag{font-size:10.5px;padding:2px 9px;border-radius:7px;background:var(--tag-bg);color:var(--tag-text);font-weight:600}
.badge-entity{font-size:10.5px;padding:2px 9px;border-radius:7px;background:var(--accent-light);color:var(--accent-strong);font-weight:700;text-decoration:none;border:1px solid var(--accent)}
.badge-entity:hover{filter:brightness(.97)}
.badge-rv{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:10px;white-space:nowrap;color:#fff}
.badge-rv.s-high{background:rgba(16,185,129,.72)}
.badge-rv.s-mid{background:rgba(14,165,183,.68)}
.badge-rv.s-low{background:rgba(148,163,184,.55)}
.badge-deep{background:var(--fund-bg);color:var(--fund-text);font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:10px;white-space:nowrap;margin-left:4px}
.badge-score{font-size:12px;font-weight:800;padding:3px 10px;border-radius:10px;white-space:nowrap;color:#fff}
/* 评分半透明底色（按分数段区分） */
.badge-score.s-high{background:rgba(16,185,129,.72)}   /* ≥7 绿 */
.badge-score.s-mid{background:rgba(14,165,183,.68)}     /* 4–6.9 蓝 */
.badge-score.s-low{background:rgba(148,163,184,.55)}    /* <4 灰 */
.viral-tag{font-size:14px;font-weight:800;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}


/* ===== 精选卡片增强 ===== */
.sel-scores{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:5px 0 3px}
.dim-line{display:flex;gap:5px;flex-wrap:wrap}
.dim-chip{font-size:10.5px;color:var(--text-secondary);background:var(--surface-2);padding:2px 8px;border-radius:9px;font-weight:600;border:1px solid var(--border)}
.dim-chip b{color:var(--accent-strong);font-weight:800}

/* ===== 空状态 ===== */
.empty-state{text-align:center;padding:54px 20px;color:var(--text-muted)}
.empty-state .es-ico{font-size:40px;opacity:.5}
.empty-state .es-text{font-size:14px;margin-top:10px}

/* ===== Footer ===== */
.footer{text-align:center;padding:34px 0 18px;font-size:12px;color:var(--text-muted);border-top:1px solid var(--border);margin-top:28px;line-height:1.7}
.hidden{display:none!important}

/* ===== 首页辅助工具栏（已废弃，统一到时间行右侧） ===== */
.index-sub-tools{display:none!important}

/* ===== 企业库L2子分类展开行 ===== */
.f-btn-l2{font-size:10.5px;padding:3px 10px;height:26px}
.l2-row{padding-left:40px;border-left:3px solid var(--accent);background:#f0f9ff;margin-left:16px;padding-top:6px;padding-bottom:6px;border-radius:0 8px 8px 0;margin-top:4px}

/* ===== 企业库工具栏（每行独占一个筛选项） ===== */
.filter-main{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:10px;line-height:1}
.filter-sub{align-items:center;gap:0;flex-wrap:wrap;display:none} /* 旧布局隐藏 */
.btn-group{display:inline-flex;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);height:28px}
.btn-group .f-btn{border-radius:0;border:none;padding:4px 13px;font-size:12px;height:28px;line-height:1}
.btn-group .f-btn:first-child{border-radius:14px 0 0 14px}
.btn-group .f-btn:last-child{border-radius:0 14px 14px 0}
.sort-group{display:inline-flex;gap:5px;flex-wrap:wrap;margin-left:12px}
.search-inline-group{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;margin-left:12px}
.sort-arrow{display:inline-flex;align-items:center;gap:2px;padding:4px 13px;border-radius:14px;border:1px solid var(--border);background:var(--surface);
  font-size:12px;cursor:pointer;color:var(--text-secondary);transition:.15s;font-family:inherit;white-space:nowrap;height:28px;line-height:1;box-sizing:border-box}
.sort-arrow:hover{border-color:var(--accent);color:var(--accent-strong)}
.sort-arrow.active{background:var(--accent-grad);color:#fff;border-color:transparent}
.quick-filters{display:inline-flex;gap:5px;margin-left:auto;flex-wrap:wrap}

/* ===== 企业库通用按钮：统一高度 28px ===== */
.toolbar{margin-bottom:16px}
.f-label{font-size:11.5px;color:var(--text-muted);font-weight:700;margin-right:4px;width:28px;flex-shrink:0;text-align:left}
.f-btn{padding:4px 12px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-size:12px;
  cursor:pointer;color:var(--text-secondary);white-space:nowrap;transition:all .15s;font-family:inherit;height:28px;line-height:1;display:inline-flex;align-items:center}
.f-btn:hover{border-color:var(--accent);color:var(--accent-strong)}
.f-btn.active{background:var(--accent-grad);color:#fff;border-color:transparent;font-weight:700}
.f-btn .cnt{font-size:9px;opacity:.55;margin-left:2px;font-weight:400}
.filter-btn .cnt{font-size:9px;opacity:.55;margin-left:2px;font-weight:400}
.f-btn-l2{font-size:10.5px;padding:3px 10px}
.l2-row{padding-left:36px;margin-left:4px;padding-top:5px;padding-bottom:5px;border-left:2px solid #cbd5e1;margin-top:3px}
.view-toggle{display:inline-flex;gap:0;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);height:28px}
.view-btn{padding:4px 14px;border:none;background:var(--surface);font-size:12px;cursor:pointer;color:var(--text-secondary);transition:all .15s;font-family:inherit;height:28px;line-height:1}
.view-btn:hover{background:var(--surface-2)}
.view-btn.active{background:var(--accent-grad);color:#fff;font-weight:700}
.reg-btn{padding:4px 14px;border:none;background:var(--surface);font-size:12px;cursor:pointer;color:var(--text-secondary);transition:all .15s;font-family:inherit;height:28px;line-height:1}
.reg-btn:hover{background:var(--surface-2)}
.reg-btn.active{background:var(--accent-grad);color:#fff;font-weight:700}
.result-count{font-size:11.5px;color:var(--text-muted);margin-bottom:10px;padding-left:3px;font-weight:600}

.ent-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px;margin-bottom:12px;
  transition:transform .14s,box-shadow .14s,border-color .14s;box-shadow:var(--shadow-sm)}
.ent-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border-strong)}
.ent-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;line-height:1.6}
.ent-name{font-weight:700;font-size:15.5px;color:var(--text)}
.ent-badge{font-size:10px;padding:2px 9px;border-radius:5px;font-weight:600;white-space:nowrap}
.badge-cat{background:var(--cat-bg);color:var(--cat-text)}
.badge-region{font-size:10px;color:var(--text-muted);background:transparent;padding:0 6px;font-weight:600}
.badge-rv{font-size:10.5px;padding:2px 9px;border-radius:8px;font-weight:700;white-space:nowrap}
.badge-rv.s-high{background:#dcfce7;color:#166534}
.badge-rv.s-mid{background:#fef9c3;color:#854d0e}
.badge-rv.s-low{background:#f1f5f9;color:#64748b}
.ent-tags{display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center}
.ent-tag{font-size:10.5px;color:var(--tag-text);background:var(--tag-bg);padding:2px 8px;border-radius:6px;font-weight:500}
/* 标签数量限制：超出部分自动隐藏，由JS控制显示 */
.ent-tags.limit-tags .ent-tag:nth-child(n+4){display:none}
.tag-overflow{font-size:10.5px;color:var(--accent-strong);background:var(--accent-light);padding:2px 8px;border-radius:6px;
  font-weight:700;cursor:pointer;user-select:none;border:1px dashed var(--accent);transition:all .13s;display:inline-block;margin-left:2px}
.tag-overflow:hover{background:var(--accent);color:#fff;border-style:solid}
.ent-desc{font-size:13px;color:var(--text-secondary);line-height:1.65;margin:6px 0}
.ent-highlights{font-size:11.5px;color:var(--accent-strong);line-height:1.55;margin:4px 0;font-style:italic}
.ent-meta{display:flex;gap:10px;font-size:11px;color:var(--text-muted);flex-wrap:wrap;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed #f0f2f6}
.meta-item{white-space:nowrap}
.meta-fund{color:#b45309;font-weight:700;background:#fffbeb;padding:2px 8px;border-radius:6px}
.meta-fund-total{color:#92650e;font-weight:700;background:#fef3c7;padding:2px 8px;border-radius:6px}
.meta-biz{color:var(--text-muted);font-size:10.5px;font-style:italic;opacity:.75}
.meta-source{font-size:10.5px;opacity:.6}
.meta-links{margin-left:auto}
.ent-link{font-size:11.5px;color:var(--accent-strong);text-decoration:underline}

  if (mode === 'news') {
    // 兼容旧模式：按匹配资讯数降序
    rows.sort(function(a, b) {
      let cmp = (b.n || 0) - (a.n || 0);
      if (cmp === 0) cmp = (b.rc || 0) - (a.rc || 0);
      if (cmp === 0) cmp = (parseFloat(b.v) || 0) - (parseFloat(a.v) || 0);
      return cmp;
    });
    return;
  }
  if (activeRecent) {
    // 聚焦近期：按最近动态时间倒序（无日期的排末尾）
    rows.sort(function(a, b) {
      const da = a.ln || '';
      const db = b.ln || '';
      if (da && db) return db.localeCompare(da);
      if (da) return -1;
      if (db) return 1;
      return 0;
    });
    return;
  }
  rows.sort(function(a, b) {
    let cmp;
    if (mode === 'fund') {
      cmp = (b.f || 0) - (a.f || 0);
    } else {
      cmp = (parseFloat(b.v) || 0) - (parseFloat(a.v) || 0);
    }
    if (entSortDir === 'asc') cmp = -cmp;
    return cmp;
  });
}

function spToggleRecentFilter() {
  activeRecent = !activeRecent;
  const btn = document.querySelector('.recent-filter-btn');
  if (btn) btn.classList.toggle('active', activeRecent);
  filterEnt();
}

/* ==================== 2026-08-01 前端瘦身：按需渲染引擎 ====================
   以前：Python 把 2934 张卡片的 HTML 全部内联进页面（10.99 MB），浏览器要先
         解析出 4 万多个 DOM 节点、再给 1.7 万个按钮逐个挂点击事件，然后才轮到
         你看见第一屏 —— 所以「一下子加载不出来」。
   现在：页面本体只剩骨架，2934 条数据放外部 enterprise_data.js；
         筛选/排序/搜索全部在数据数组上算（不碰 DOM），
         只把当前要看的这几十家「现做成」卡片贴到页面上。
   功能一条没减：搜索、同义词扩展、地区/分类/子类/标签/时间/近期动态筛选、
                 三种排序、收藏、备注、已读、不再显示、收藏标签、深链跳转全在。 */
var SP_ROWS = [], SP_NEWS = {}, SP_BOOTED = false;
var entRendered = 40, ENT_PAGE = 40, lastMatched = [];

/* 五个操作按钮长得一模一样，只有 id 不同 —— 模板只下发一份（省下 2.24 MB）*/
var ENT_ACT_TPL = "<button class=\"fav-btn\" data-type=\"ent\" data-id=\"__ID__\"><span class=\"ico\">☆</span><span class=\"lbl\">收藏</span></button> <button class=\"act-btn\" data-act=\"hide\" data-type=\"ent\" data-id=\"__ID__\" title=\"暂不考虑（隐藏，可在工具栏找回）\"><span class=\"ico\">🚫</span><span class=\"lbl\">不再显示</span></button><button class=\"act-btn\" data-act=\"note\" data-type=\"ent\" data-id=\"__ID__\" title=\"添加/编辑备注（仅存本机浏览器）\"><span class=\"ico\">📝</span><span class=\"lbl\">备注</span></button><button class=\"act-btn\" data-act=\"favtag\" data-type=\"ent\" data-id=\"__ID__\" title=\"给收藏加标签（fav-mode 下可筛选）\"><span class=\"ico\">🏷</span><span class=\"lbl\">标签</span></button><button class=\"read-btn\" data-act=\"read\" data-type=\"ent\" data-id=\"__ID__\" title=\"标记已读/未读（与收藏无关）\"><span class=\"ico\">○</span><span class=\"lbl\">未读</span></button>";
var ENT_NOTE_TPL = '<div class="card-note empty" data-card-type="ent" data-card-id="__ID__"></div>';

function entEscAttr(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function entHostOf(u) {
  var m = /^https?:\/\/([^/?#]+)/i.exec(String(u || ''));
  return m ? m[1].replace(/^www\./, '') : '相关链接';
}

/* 相关资讯区块：有名单才渲染，没有就整块不出现（不留空壳）。
   名单由资讯库 AI 每日投递，字段缺了也不报错，最多列 3 条，超出显示「共 N 条」。*/
function entNewsHtml(serial) {
  var e = serial && SP_NEWS ? SP_NEWS[serial] : null;
  if (!e) return '';
  var list = (e && e.l) || [];
  if (!list.length) return '';
  var items = [];
  for (var i = 0; i < list.length && i < 3; i++) {
    var u = list[i] && list[i][0];
    if (!u) continue;
    var t = (list[i][1] || '').trim() || entHostOf(u);
    items.push('<a href="' + entEscAttr(u) + '" class="ent-news-link" '
      + 'onclick="return openBg(this.href)" title="' + entEscAttr(u) + '">'
      + entEscAttr(t) + '</a>');
  }
  if (!items.length) return '';
  var total = e.n || items.length;
  var more = (total > items.length) ? ' <span class="ent-news-more">共 ' + total + ' 条</span>' : '';
  var why = e.r ? ' title="' + entEscAttr(e.r) + '"' : '';
  return '<div class="ent-news"><span class="ent-news-label"' + why + '>📰 相关资讯</span>'
       + items.join(' · ') + more + '</div>';
}

/* 检索文本：从卡片 HTML 里剥掉标签现算，用完缓存在这一行上。
   以前是 Python 把同一段文本重复内联成 data-name + data-search 两份（1.22 MB）。*/
var _ENT_ENT = {'&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&#39;':"'",'&nbsp;':' '};
function entBlob(row) {
  if (row._b === undefined) {
    row._b = ((row.h || '')
      .replace(/<!--[\s\S]*?-->/g, ' ')
      .replace(/<[^>]*>/g, ' ')
      .replace(/&(?:amp|lt|gt|quot|#39|nbsp);/g, function(m) { return _ENT_ENT[m] || ' '; })
      + ' ' + (row.k || '')).toLowerCase();
  }
  return row._b;
}
function entTagArr(row) {
  if (row._t === undefined) {
    row._t = (row.t || '').split(' ').filter(Boolean).map(function(x) { return x.toLowerCase(); });
  }
  return row._t;
}

/* 收藏 / 已隐藏 / 已读 状态：卡片没渲染出来时读不到 DOM，直接从本机存储扫一遍。
   扫的是「用户存了多少条」（几十到几百），不是 2934 家，所以很快。*/
function entStateSets() {
  var h = {}, r = {}, f = {};
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!k) continue;
      if (k.indexOf('sp_hide::ent::') === 0) { if (localStorage.getItem(k) === '1') h[k.slice(14)] = 1; }
      else if (k.indexOf('sp_read::ent::') === 0) { if (localStorage.getItem(k) === '1') r[k.slice(14)] = 1; }
      else if (k.indexOf('sp_fav::ent::') === 0) { if (localStorage.getItem(k) === '1') f[k.slice(13)] = 1; }
      else if (k.indexOf('sp_fav_tags::ent::') === 0) {
        var v = localStorage.getItem(k);
        if (v && v !== '[]') f[k.slice(18)] = 1;
      }
    }
  } catch (e) {}
  return { h: h, r: r, f: f };
}

/* 把一条数据行变成真正的卡片节点。建过一次就存在 row._el 上，翻页来回不重复建。*/
function entElOf(row) {
  if (row._el) return row._el;
  var s = row.s || '';
  var d = document.createElement('div');
  d.className = 'ent-card';
  if (row.i) d.id = row.i;
  d.dataset.cardId = s;
  d.dataset.serial = s;
  d.dataset.region = row.r || '';
  d.dataset.country = row.c || '';
  d.dataset.cat = row.g || '';
  d.dataset.l2 = row.l || '';
  d.dataset.tags = row.t || '';
  d.dataset.curated = row.u || '0';
  d.dataset.rv = row.v || '0';
  d.dataset.news = row.n || 0;
  d.dataset.fund = row.f || 0;
  d.dataset.hasfund = row.hf || 0;
  d.dataset.ipo = row.ip || 0;
  d.dataset.recent = row.rc || 0;
  d.dataset.lastnews = row.ln || '';
  var acts = s ? ENT_ACT_TPL.split('__ID__').join(entEscAttr(s)) : '';
  var note = s ? ENT_NOTE_TPL.split('__ID__').join(entEscAttr(s)) : '';
  d.innerHTML = (row.h || '').replace('<!--A-->', acts) + entNewsHtml(s) + note;
  entHydrate(d, s);
  row._el = d;
  return d;
}

/* 给新做出来的卡片接上收藏/备注/已读那套逻辑（函数本体在页面底部的公共脚本里）。
   以前是页面一打开就给 2934 张卡片挂 1.7 万个事件，现在只给看得见的这几十张挂。*/
function entHydrate(el, serial) {
  if (!serial || typeof spKey !== 'function') return;
  var fb = el.querySelector('.fav-btn');
  if (fb) {
    var on = localStorage.getItem(spKey('ent', serial)) === '1';
    try { if (!on && spGetFavTags('ent', serial).length) on = true; } catch (e) {}
    if (on) {
      fb.classList.add('on');
      var ic = fb.querySelector('.ico'); if (ic) ic.textContent = '🔖';
      var lb = fb.querySelector('.lbl'); if (lb) lb.textContent = '已收藏';
      el.dataset.fav = '1';
    }
    fb.addEventListener('click', function() { spToggleFav(fb); });
  }
  el.querySelectorAll('.act-btn,.read-btn').forEach(function(b) {
    var act = b.dataset.act;
    if (act === 'hide' && localStorage.getItem(spHideKey('ent', serial)) === '1') {
      b.classList.add('on');
      var l1 = b.querySelector('.lbl'); if (l1) l1.textContent = '已隐藏';
      el.dataset.hide = '1';
    } else if (act === 'read' && localStorage.getItem(spReadKey('ent', serial)) === '1') {
      b.classList.add('read-on');
      var l2 = b.querySelector('.lbl'); if (l2) l2.textContent = '已读';
      var i2 = b.querySelector('.ico'); if (i2) i2.textContent = '●';
      el.dataset.read = '1';
    }
    b.addEventListener('click', function(ev) {
      ev.preventDefault(); ev.stopPropagation();
      if (act === 'hide') spToggleHide(b);
      else if (act === 'note') spEditNote('ent', serial);
      else if (act === 'read') spToggleRead(b);
      else if (act === 'favtag') spOpenTagPopover(b);
    });
  });
  var nb = el.querySelector('.card-note');
  if (nb) {
    spRenderNote(nb, 'ent', serial);
    nb.addEventListener('click', function() { spEditNote('ent', serial); });
  }
}

function filterEnt() {
  if (!SP_BOOTED) return;   // 数据还没到，先不算（避免闪一下「0 家」）
  entRendered = ENT_PAGE;   // 每次筛选从头分页(渐进渲染, 先显示前20家)
  sortEnt();
  const qRaw = (document.getElementById('search').value || '').trim().toLowerCase();
  const q = qRaw;
  // 同类词扩展：把搜索词扩展到其规范词及全部同义词（如 老花镜→眼镜+视觉障碍+高科技眼镜…）
  let qTerms = q ? [q] : [];
  if (q && typeof SYN_FLAT !== 'undefined' && SYN_FLAT[q]) {
    const canon = SYN_FLAT[q];
    if (CANON_SYN[canon]) qTerms = qTerms.concat(CANON_SYN[canon].map(function(t){ return t.toLowerCase(); }));
  }
  const rows = SP_ROWS;
  const st = entStateSets();
  const favMode = document.body.classList.contains('fav-mode');
  let visible = 0;
  const catVisCounts = {};
  const l2VisCounts = {};
  const matched = [];
  let totalVis = 0;
  // 时间筛选的截止日只算一次，别在 2934 次循环里反复 new Date
  let timeCut = null;
  if (activeEntTime !== 'all') {
    const days = {'1w':7,'2w':14,'1m':30,'3m':90,'6m':180,'1y':365}[activeEntTime] || 0;
    timeCut = new Date(); timeCut.setDate(timeCut.getDate() - days);
  }

  rows.forEach(row => {
    const sid = row.s || '';
    const catList = (row.g || '').split(' ').filter(Boolean);
    const l2List = (row.l || '').split(' ').filter(Boolean);

    // 搜索打分：3=标签精确命中(含扩展同义词) 2=标签子串命中(最小颗粒度, 如 护理⊂专业护理/硬件⊂智能硬件) 1=仅在名称/描述/推荐理由 0=不命中
    let score = 0;
    if (q) {
      const tags = entTagArr(row);
      for (const qt of qTerms) { if (tags.indexOf(qt) >= 0) { score = 3; break; } }
      if (score < 3) {
        for (const qt of qTerms) {
          for (const t of tags) { if (t.indexOf(qt) >= 0 || qt.indexOf(t) >= 0) { score = 2; break; } }
          if (score === 2) break;
        }
      }
      // 全文兜底也用扩展词：搜"防跌倒"时，摘要/推荐理由里写"跌倒检测"的企业同样命中
      if (score < 2) {
        const blob = entBlob(row);
        for (const qt of qTerms) { if (blob.indexOf(qt) >= 0) { score = 1; break; } }
      }
    }
    row._score = score;

    const regMatch = activeReg === 'all' || ((activeReg === '1' || activeReg === '2') ? (row.r || '') === activeReg : (row.c || '') === activeReg);
    const searchMatch = !q || score > 0;
    const catMatch = activeCat === 'all' || catList.indexOf(activeCat) >= 0;
    const l2Match = activeL2 === 'all' || l2List.indexOf(activeL2) >= 0;
    const tagMatch = activeTag === 'all' || (activeTag === '__funded__' ? (row.hf === 1) : entTagArr(row).indexOf(activeTag.toLowerCase()) >= 0);
    const recentMatch = !activeRecent || row.rc === 1;
    const hiddenMatch = (window.spShowHidden === true) || !st.h[sid];
    const readMatch = (window.spUnreadOnly !== true) || !st.r[sid];
    const favMatch = !favMode || !!st.f[sid];
    let timeMatch = true;
    if (timeCut) {
      const d = row.ln || '';
      timeMatch = d ? (new Date(d.replace(/-/g, '/')) >= timeCut) : false;
    }

    if (regMatch && searchMatch && tagMatch && recentMatch && hiddenMatch && readMatch && favMatch && timeMatch) {
      totalVis++;
      catList.forEach(function(c){ catVisCounts[c] = (catVisCounts[c]||0)+1; });
      if (activeCat === 'all') {
        catList.forEach(function(c){ l2List.forEach(function(l){ if(!l2VisCounts[c]) l2VisCounts[c]={}; l2VisCounts[c][l]=(l2VisCounts[c][l]||0)+1; }); });
      } else if (catList.indexOf(activeCat) >= 0) {
        l2List.forEach(function(l){ if(!l2VisCounts[activeCat]) l2VisCounts[activeCat]={}; l2VisCounts[activeCat][l]=(l2VisCounts[activeCat][l]||0)+1; });
      }
      if (catMatch && l2Match) {
        visible++;
        matched.push(row);
      }
    }
  });

  // 搜索命中时重排：精确标签命中最前，再按研究分、资讯数，让最贴切的排最前
  if (q && matched.length) {
    matched.sort(function(a, b) {
      const ds = (b._score || 0) - (a._score || 0);
      if (ds !== 0) return ds;
      const dr = (parseFloat(b.v) || 0) - (parseFloat(a.v) || 0);
      if (dr !== 0) return dr;
      return (b.n || 0) - (a.n || 0);
    });
  }

  // 渐进渲染: 只把前 entRendered 家做成卡片贴上去, 其余滚到底再追加
  lastMatched = matched;
  paintEnt();

  // Update L1 category counts
  document.querySelectorAll('#cat-filter [data-cat]').forEach(btn => {
    const c = btn.dataset.cat;
    const cntEl = btn.querySelector('.cnt');
    if (c === 'all') {
      if (cntEl) cntEl.textContent = totalVis;
    } else {
      if (cntEl) cntEl.textContent = catVisCounts[c] || 0;
    }
  });

  // Update L2 subcategory counts
  document.querySelectorAll('.f-btn-l2').forEach(btn => {
    const parent = btn.dataset.parent;
    const l2 = btn.dataset.l2;
    const cntEl = btn.querySelector('.cnt');
    if (cntEl) cntEl.textContent = (l2VisCounts[parent] && l2VisCounts[parent][l2]) || 0;
  });

  // Update result count
  entTotalVisible = visible;
  entUpdateCount();
}

/* 结果条文案单独抽出来：以前「加载更多」里另写了一份短文案，
   一滚动就把「· 中国 · 有融资/IPO」这些筛选条件抹掉了，看着像筛选被重置。*/
var entTotalVisible = 0;
function entUpdateCount() {
  const rc = document.getElementById('result-count');
  if (!rc) return;
  const parts = [];
  parts.push(activeReg === 'all' ? '全部地区' : (activeReg === '1' ? '中国' : (activeReg === '2' ? '海外' : activeReg)));
  if (activeCat !== 'all') parts.push(activeCat);
  if (activeL2 !== 'all') parts.push(activeL2);
  if (activeTag !== 'all') parts.push(activeTag === '__funded__' ? '有融资/IPO' : activeTag);
  if (typeof activeEntTime !== 'undefined' && activeEntTime !== 'all') {
    parts.push({'1w':'近1周','2w':'近2周','1m':'近1月','3m':'近3月','6m':'近半年','1y':'近1年'}[activeEntTime] || activeEntTime);
  }
  if (activeRecent) parts.push('近期有动态');
  if (document.body.classList.contains('fav-mode')) parts.push('仅看收藏');
  if (window.spUnreadOnly === true) parts.push('仅看未读');
  const shown = Math.min(entRendered, entTotalVisible);
  rc.textContent = '展示 ' + shown + ' / 共 ' + entTotalVisible + ' 家企业 · ' + parts.join(' · ');
}

// 渐进渲染: 控制可见卡片数量(方案A: 先显示前40家, 点"加载更多"追加)
// 外链后台打开：openBg() 在新标签页打开但不切换

/* 把当前该看的这一批贴进列表。
   append=true 表示「往下追加」（滚动加载/点加载更多），不重建已经在页面上的部分，
   避免滚动位置跳动；筛选/排序变了则整段重铺。*/
function paintEnt(append) {
  const list = document.getElementById('ent-list');
  if (!list) return;
  const matched = lastMatched || [];
  const target = Math.min(entRendered, matched.length);
  const painted = list._painted || 0;
  const frag = document.createDocumentFragment();
  if (append && target > painted) {
    for (let i = painted; i < target; i++) frag.appendChild(entElOf(matched[i]));
    list.appendChild(frag);
  } else if (!append) {
    for (let i = 0; i < target; i++) frag.appendChild(entElOf(matched[i]));
    list.textContent = '';   // 卡片节点缓存在数据行上, 清空不会导致重复创建
    list.appendChild(frag);
  }
  list._painted = target;
  // 收藏标签筛选是按 DOM 上的卡片打标的，追加出来的新卡片要补算一次，
  // 否则「收藏视图 + 选了标签」时滚动加载出来的卡片会漏筛。
  if (append && document.body.classList.contains('fav-mode')
      && typeof spApplyFavTagFilter === 'function') {
    spApplyFavTagFilter();
  }
  const btn = document.getElementById('ent-loadmore');
  if (btn) {
    if (entRendered < matched.length) {
      btn.style.display = '';
      btn.textContent = '加载更多（剩余 ' + (matched.length - entRendered) + ' 家）';
    } else {
      btn.style.display = 'none';
    }
  }
}
// 加载更多按钮
(function() {
  const btn = document.getElementById('ent-loadmore');
  if (btn) {
    btn.addEventListener('click', function() {
      entRendered += ENT_PAGE;
      paintEnt(true);
      entUpdateCount();
    });
  }
})();

// 无限滚动：接近底部自动加载下一批（复用 +ENT_PAGE 渐进渲染，按钮保留为兜底）
(function() {
  let autoLoading = false;
  function tryAutoLoad() {
    if (autoLoading) return;
    const btn = document.getElementById('ent-loadmore');
    if (!btn || btn.style.display === 'none') return;
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 600) {
      autoLoading = true;
      entRendered += ENT_PAGE;
      paintEnt(true);
      entUpdateCount();
      setTimeout(function() { autoLoading = false; }, 60);
    }
  }
  window.addEventListener('scroll', tryAutoLoad, {passive:true});
  window.addEventListener('resize', tryAutoLoad, {passive:true});
  // 首次渲染后若内容已接近底部（如当前筛选结果很少），也尝试触发
  tryAutoLoad();
})();

// Sort toggle is handled via onclick="setEntSort(...)" arrow buttons (see toolbar)

// Tag pill toggle (replaces old <select>)
document.querySelectorAll('.ent-tag-pills [data-tag]').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.ent-tag-pills [data-tag]').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    activeTag = this.dataset.tag;
    filterEnt();
  });
});

// Region filter
document.querySelectorAll('[data-reg]').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('[data-reg]').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    activeReg = this.dataset.reg;

    activeL2 = 'all';
    document.querySelectorAll('#cat-filter [data-cat]').forEach(b => b.classList.toggle('active', b.dataset.cat === 'all'));
    hideAllL2Rows();

  });
});

// L1 Category filter
document.querySelectorAll('#cat-filter [data-cat]').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('#cat-filter [data-cat]').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    activeCat = this.dataset.cat;
    activeL2 = 'all';
    // Show/hide L2 subcategory row
    hideAllL2Rows();
    if (activeCat !== 'all') {

/* 资讯页深链跳转：enterprise.html#ent-xxxxxxxx
   卡片是按需渲染的（默认只做前 40 家），所以要先把目标卡片"翻页翻出来"再滚动。 */
function spJumpToEnt() {
  const h = (location.hash || '').replace(/^#/, '');
  if (!/^ent-[a-f0-9]+$/.test(h)) return;
  if (!SP_BOOTED) return;
  const matched = lastMatched || [];
  let idx = -1;
  for (let i = 0; i < matched.length; i++) { if (matched[i].i === h) { idx = i; break; } }
  if (idx >= 0) {
    if (entRendered <= idx) {
      entRendered = Math.ceil((idx + 1) / ENT_PAGE) * ENT_PAGE;
      paintEnt(true);
      entUpdateCount();
    }
  } else {
    /* 被当前筛选/已读/隐藏挡住了 → 单独把这一张贴到列表最前，保证深链永远到得了 */
    let row = null;
    for (let j = 0; j < SP_ROWS.length; j++) { if (SP_ROWS[j].i === h) { row = SP_ROWS[j]; break; } }
    if (!row) return;
    const list = document.getElementById('ent-list');
    if (list) list.insertBefore(entElOf(row), list.firstChild);
  }
  const card = document.getElementById(h);
  if (!card) return;
  setTimeout(function() {
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.add('ent-jump-hl');
    setTimeout(function() { card.classList.remove('ent-jump-hl'); }, 2800);
  }, 60);
}
window.addEventListener('hashchange', spJumpToEnt);

/* 开机：等外部 enterprise_data.js / enterprise_news.js 到位后再算第一屏。
   用 load 而不是 DOMContentLoaded，是为了确保排在公共脚本 spInitFav 之后 ——
   那样 spInitFav 扫到的是一个空列表，卡片上的按钮只由这里挂一次，不会挂两遍。*/
function spEntBoot() {
  if (SP_BOOTED) return;
  SP_ROWS = window.SP_ENT_ROWS || [];
  SP_NEWS = window.SP_ENT_NEWS || {};
  SP_BOOTED = true;
  if (!SP_ROWS.length) {
    const rc = document.getElementById('result-count');
    if (rc) rc.textContent = '企业数据没能载入（缺少 enterprise_data.js），请重新生成页面。';
    return;
  }
  filterEnt();
  spJumpToEnt();
}

else window.addEventListener('load', spEntBoot);

<script>
function spKey(t,id){return 'sp_fav::'+t+'::'+id;}
function spCardOf(b){return b.closest('.feed-item, .ent-card');}
/* 收藏切换：图标变书签丝带 + 更新 data-fav + 刷新筛选计数 */
function spToggleFav(b){
  var k=spKey(b.dataset.type,b.dataset.id);
  var on=localStorage.getItem(k)==='1';on=!on;
  localStorage.setItem(k,on?'1':'0');
  b.classList.toggle('on',on);
  var ico=b.querySelector('.ico');
  if(ico) ico.textContent=on?'🔖':'☆';
  var l=b.querySelector('.lbl');if(l)l.textContent=on?'已收藏':'收藏';
  var c=spCardOf(b);if(c)c.dataset.fav=on?'1':'0';
  spRenderFavFilter();
}
function spFavCount(){
  var n=0;
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k.indexOf('sp_fav::')===0 && localStorage.getItem(k)==='1') n++;
  }
  return n;
}
/* 已收藏筛选胶囊：渲染计数 + 点击切换 fav-mode */
function spRenderFavFilter(){
  var btns=document.querySelectorAll('.fav-filter-btn');
  var n=spFavCount();
  btns.forEach(function(btn){
    var cntEl=btn.querySelector('.fav-cnt');
    if(cntEl) cntEl.textContent=n;
    /* 如果在 fav-mode 但已无收藏项，自动退出 */
    if(document.body.classList.contains('fav-mode')&&n===0){
      document.body.classList.remove('fav-mode');
      btn.classList.remove('on');
    }
  });
}
/* ===== 收藏标签（可筛标签）=====
   存储：sp_fav_tags::<type>::<id> = JSON 数组；打标签即视为已收藏。 */
var SP_FAV_TAGS=['重点','选题参考','竞品','跟进','深度'];
var spFavTagFilter=[];   /* fav-mode 下激活的标签筛选 */
function spFavTagsKey(t,id){return 'sp_fav_tags::'+t+'::'+id;}
function spGetFavTags(t,id){try{var v=localStorage.getItem(spFavTagsKey(t,id));return v?JSON.parse(v):[];}catch(e){return[];}}
function spSetFavTags(t,id,arr){if(arr&&arr.length){localStorage.setItem(spFavTagsKey(t,id),JSON.stringify(arr));}else{localStorage.removeItem(spFavTagsKey(t,id));}}
/* 切换某个标签：加标签自动置为已收藏；返回当前标签数组 */
function spToggleFavTag(t,id,tag){
  var arr=spGetFavTags(t,id);
  var i=arr.indexOf(tag);
  if(i>=0)arr.splice(i,1);else arr.push(tag);
  spSetFavTags(t,id,arr);
  if(arr.length){
    if(localStorage.getItem(spKey(t,id))!=='1'){
      localStorage.setItem(spKey(t,id),'1');
      var fb=document.querySelector('.fav-btn[data-type="'+t+'"][data-id="'+id+'"]');
      if(fb){
        fb.classList.add('on');
        var ico=fb.querySelector('.ico');if(ico)ico.textContent='🔖';
        var l=fb.querySelector('.lbl');if(l)l.textContent='已收藏';
        var c=spCardOf(fb);if(c)c.dataset.fav='1';
      }
    }
  }
  spRenderFavFilter();
  return arr;
}
/* fav-mode 下按激活标签筛选收藏（未命中则打 data-fav-tag-miss 由 CSS 隐藏） */
function spApplyFavTagFilter(){
  var sel=spFavTagFilter;
  document.querySelectorAll('.feed-item,.ent-card').forEach(function(c){
    if(c.dataset.fav!=='1'){c.removeAttribute('data-fav-tag-miss');return;}
    var t=c.classList.contains('ent-card')?'ent':'news';
    var id=c.dataset.cardId||c.dataset.serial||'';
    if(!id){c.removeAttribute('data-fav-tag-miss');return;}
    var tags=spGetFavTags(t,id);
    var miss=(sel.length>0)&&!sel.some(function(x){return tags.indexOf(x)>=0;});
    if(miss)c.setAttribute('data-fav-tag-miss','1');else c.removeAttribute('data-fav-tag-miss');
  });
}
/* 收藏标签弹层（单例） */
function spCloseTagPopover(){var p=document.getElementById('sp-tag-pop');if(p)p.remove();document.removeEventListener('click',spPopOutside);}
function spPopOutside(e){
  var p=document.getElementById('sp-tag-pop');
  if(p&&!p.contains(e.target)&&!(e.target.closest&&e.target.closest('.act-btn[data-act="favtag"]'))){spCloseTagPopover();}
}
function spOpenTagPopover(btn){
  spCloseTagPopover();
  var t=btn.dataset.type,id=btn.dataset.id;
  var pop=document.createElement('div');pop.id='sp-tag-pop';pop.className='sp-tag-pop';
  var head=document.createElement('div');head.className='sp-tag-pop-h';head.textContent='收藏标签（点击切换）';pop.appendChild(head);
  var cur=spGetFavTags(t,id);
  SP_FAV_TAGS.forEach(function(tag){
    var chip=document.createElement('button');chip.className='sp-tag-chip'+(cur.indexOf(tag)>=0?' on':'');chip.textContent=tag;
    chip.onclick=function(){spToggleFavTag(t,id,tag);chip.classList.toggle('on');};
    pop.appendChild(chip);
  });
  var inp=document.createElement('input');inp.className='sp-tag-input';inp.placeholder='自定义标签后回车';
  inp.onkeydown=function(e){if(e.key==='Enter'){var v=inp.value.trim();if(v){spToggleFavTag(t,id,v);spOpenTagPopover(btn);}}};
  pop.appendChild(inp);
  document.body.appendChild(pop);
  var r=btn.getBoundingClientRect();
  var pw=pop.offsetWidth,ph=pop.offsetHeight;
  var left=Math.min(r.left,window.innerWidth-pw-8);if(left<8)left=8;
  var top=r.bottom+6;if(top+ph>window.innerHeight-8)top=r.top-ph-6;
  pop.style.left=left+'px';pop.style.top=top+'px';
  setTimeout(function(){document.addEventListener('click',spPopOutside);},0);
}
/* fav-mode 下渲染收藏标签筛选条 */
function spBuildFavTagPills(){
  var wrap=document.getElementById('fav-tag-pills');if(!wrap)return;
  wrap.innerHTML='';
  var all=document.createElement('button');all.className='filter-btn active';all.textContent='全部';all.dataset.ftag='all';
  all.onclick=function(){spFavTagFilter=[];spRenderFavTagPills();if(window.spReapply)spReapply();};
  wrap.appendChild(all);
  SP_FAV_TAGS.forEach(function(tag){
    var b=document.createElement('button');b.className='filter-btn';b.textContent=tag;b.dataset.ftag=tag;
    b.onclick=function(){var i=spFavTagFilter.indexOf(tag);if(i>=0)spFavTagFilter.splice(i,1);else spFavTagFilter.push(tag);spRenderFavTagPills();if(window.spReapply)spReapply();};
    wrap.appendChild(b);
  });
}
function spRenderFavTagPills(){
  var wrap=document.getElementById('fav-tag-pills');if(!wrap)return;
  wrap.querySelectorAll('.filter-btn').forEach(function(b){
    var t=b.dataset.ftag;
    b.classList.toggle('active',(t==='all')?(spFavTagFilter.length===0):(spFavTagFilter.indexOf(t)>=0));
  });
}
function spToggleFavFilter(){
  var on=!document.body.classList.contains('fav-mode');
  document.body.classList.toggle('fav-mode',on);
  var btns=document.querySelectorAll('.fav-filter-btn');
  btns.forEach(function(b){b.classList.toggle('on',on);});
  /* 退出 fav-mode 时清空标签筛选 */

/* 评分色阶：根据分数加 CSS 类 */
function spScoreClass(score){
  var s=parseFloat(score)||0;
  if(s>=7) return 's-high';
  if(s>=4) return 's-mid';
  return 's-low';

/* GitHub 同步（同前） */
function spB64(str){return btoa(unescape(encodeURIComponent(str)));}
function spGhXhr(url,opts){
  var x=new XMLHttpRequest();x.open(opts.method||'GET',url,false);
  if(opts.headers)for(var h in opts.headers)x.setRequestHeader(h,opts.headers[h]);
  try{x.send(opts.body||null);}catch(e){return {status:0,responseText:String(e)};}
  return {status:x.status,responseText:x.responseText};
}
function spGhSettings(){
  var pat=prompt(
    '【配置 GitHub Token — 同步收藏到云端】\n\n'+
    '⚠️ 请粘贴完整的 Token 字符串（不是 Token 名称或描述！）\n\n'+
    '✅ 正确示例：github_pat_11CHI357I0s8q10l0fZxpz_iuTopkh3pzhB...（约70位）\n'+
    '❌ 错误：fine-grained / 我的token / shuanghello153-eng/silver-pulse \n\n'+
    '要求：Fine-grained PAT，权限 Contents: Read and Write\n'+
    '获取：GitHub → Settings → Developer settings → Fine-grained tokens → Generate new token',
    ''
  );
  if(!pat) return;
  pat=pat.trim();
  /* 格式校验 */
  var errs=[];
  if(pat.length<30) errs.push('太短（需≥30位）');
  if(/[一-鿿]/.test(pat)) errs.push('包含中文（Token 应全是英文数字）');
  if(!pat.startsWith('github_pat_')) errs.push('格式不对（应以 github_pat_ 开头）');
  if(errs.length){
    alert('❌ Token 格式错误：\n\n• '+errs.join('\n• ')+'\n\n请从 GitHub 页面复制完整 Token（一长串字符），不是名称/描述。');
    return;
  }
  localStorage.setItem('sp_gh_pat',pat);
  localStorage.setItem('sp_gh_repo','shuanghello153-eng/silver-pulse');
  localStorage.setItem('sp_gh_branch','main');
  alert('✅ Token 已保存（仅浏览器本地）。\n现在点「☁ 同步云端」即可上传收藏。');
}
function spGhSync(){
  var pat=localStorage.getItem('sp_gh_pat');
  if(!pat){ if(!confirm('首次同步需要配置 GitHub PAT（一次性，仅存本地）。\n点确定开始配置。')){return;} spGhSettings(); pat=localStorage.getItem('sp_gh_pat'); if(!pat){return;} }
  var repo=localStorage.getItem('sp_gh_repo')||'shuanghello153-eng/silver-pulse';
  var branch=localStorage.getItem('sp_gh_branch')||'main';
  var lines=[];
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf('sp_fav::')===0&&localStorage.getItem(k)==='1'){var p=k.split('::');var nid=decodeURIComponent(p[2]);var note=localStorage.getItem(spNoteKey(p[1],nid))||'';lines.push(JSON.stringify({type:p[1],id:nid,note:note,ts:new Date().toISOString()}));}}
  if(!lines.length){alert('还没有收藏任何内容，先去资讯看板或企业库点「🔖」吧。');return;}
  var btn=document.querySelector('.sync-fav');if(btn){btn.classList.add('syncing');btn.textContent='同步中';}
  var NL=String.fromCharCode(10);
  var content=spB64(lines.join(NL)+NL);
  var api='https://api.github.com/repos/'+repo+'/contents/data/feedback.jsonl';
  var headers={'Authorization':'Bearer '+pat,'Accept':'application/vnd.github+json'};
  var sha=null;
  try{var g=spGhXhr(api+'?ref='+branch,{method:'GET',headers:headers});if(g.status===200){try{sha=JSON.parse(g.responseText).sha;}catch(e){}}}catch(e){}
  var body=JSON.stringify({message:'sync favorites from Silver Pulse site',content:content,branch:branch});
  if(sha)body=JSON.stringify({message:'sync favorites from Silver Pulse site',content:content,sha:sha,branch:branch});
  var res=spGhXhr(api,{method:'PUT',headers:headers,body:body});
  if(btn){btn.classList.remove('syncing');btn.textContent='☁ 同步云端';}
  if(res.status===200||res.status===201){alert('✅ 已同步 '+lines.length+' 条收藏到云端！下次流水线会自动读取优化选题。');}
  else{var msg='同步失败（HTTP '+res.status+'）';try{var j=JSON.parse(res.responseText);if(j&&j.message)msg+='：'+j.message;}catch(e){}alert(msg);}
}
/* ===== 列表内操作：不再显示 / 备注 / 已读 ===== */
var spShowHidden=false;   /* 工具栏「显示已隐藏」总开关 */

/* 备注：编辑并存本机（同步所有同 id 备注占位） */
function spEditNote(t,id){

/* 已读未读（同步所有同 id 卡片：资讯 .feed-item + 企业库 .ent-card） */
function spSetRead(t,id,on){
  localStorage.setItem(spReadKey(t,id),on?'1':'0');

/* 工具栏总开关（显示已隐藏 / 只看未读）*/
function spInitToggles(){
  var hb=document.getElementById('hide-toggle');
  if(hb){
    try{if(localStorage.getItem('sp_show_hidden')==='1'){spShowHidden=true;hb.classList.add('on');}}catch(e){}
    hb.addEventListener('click',function(){spShowHidden=!spShowHidden;hb.classList.toggle('on',spShowHidden);try{localStorage.setItem('sp_show_hidden',spShowHidden?'1':'0');}catch(e){}if(window.spReapply)spReapply();});
  }
  var ub=document.getElementById('unread-toggle');
  if(ub){
    try{if(localStorage.getItem('sp_unread_only')==='1'){spUnreadOnly=true;ub.classList.add('on');}}catch(e){}
    ub.addEventListener('click',function(){spUnreadOnly=!spUnreadOnly;ub.classList.toggle('on',spUnreadOnly);try{localStorage.setItem('sp_unread_only',spUnreadOnly?'1':'0');}catch(e){}if(window.spReapply)spReapply();});
  }
}

/* 初始化：评分色阶 + 收藏状态 + 筛选胶囊 + 列表内操作 */
function spInitFav(){
  /* 评分徽章加色阶类 */
  document.querySelectorAll('.badge-score').forEach(function(el){
    var s=el.textContent.trim();
    el.classList.add(spScoreClass(s));
  });
  /* 收藏按钮初始化（有标签也算已收藏） */
  document.querySelectorAll('.fav-btn').forEach(function(b){
    var k=spKey(b.dataset.type,b.dataset.id);
    var on=localStorage.getItem(k)==='1';
    if(!on && spGetFavTags(b.dataset.type,b.dataset.id).length){on=true;}
    if(on){
      b.classList.add('on');
      var ico=b.querySelector('.ico');if(ico)ico.textContent='🔖';
      var l=b.querySelector('.lbl');if(l)l.textContent='已收藏';
      var c=spCardOf(b);if(c)c.dataset.fav='1';
    }
    b.addEventListener('click',function(){spToggleFav(b);});
  });
  /* 已收藏筛选胶囊 */
  document.querySelectorAll('.fav-filter-btn').forEach(function(b){
    b.addEventListener('click',spToggleFavFilter);
  });
  spRenderFavFilter();

  /* 列表内操作按钮（不再显示 / 备注 / 已读）初始化 */
  document.querySelectorAll('.act-btn,.read-btn').forEach(function(b){
    var t=b.dataset.type,id=b.dataset.id,act=b.dataset.act;
    if(act==='hide'){
      if(localStorage.getItem(spHideKey(t,id))==='1'){
        b.classList.add('on');var l=b.querySelector('.lbl');if(l)l.textContent='已隐藏';
        var c=spCardOf(b);if(c)c.dataset.hide='1';
      }
    }else if(act==='read'){
      if(localStorage.getItem(spReadKey(t,id))==='1'){
        b.classList.add('read-on');var l=b.querySelector('.lbl');if(l)l.textContent='已读';
        var ico=b.querySelector('.ico');if(ico)ico.textContent='●';
        var c=spCardOf(b);if(c)c.dataset.read='1';
      }
    }
    b.addEventListener('click',function(e){
      e.preventDefault();e.stopPropagation();
      if(act==='hide')spToggleHide(b);
      else if(act==='note')spEditNote(t,id);
      else if(act==='read')spToggleRead(b);
      else if(act==='favtag')spOpenTagPopover(b);
    });
  });
  /* 备注内容渲染 + 点击编辑 */
  document.querySelectorAll('.card-note').forEach(function(el){
    spRenderNote(el,el.dataset.cardType,el.dataset.cardId);
    el.addEventListener('click',function(){spEditNote(el.dataset.cardType,el.dataset.cardId);});
  });
  /* 资讯标题点击 → 标记已读 */
  document.querySelectorAll('.feed-item .feed-title a').forEach(function(a){
    a.addEventListener('click',function(){
      var c=a.closest('.feed-item');
      if(c&&c.dataset.cardId)spMarkRead('news',c.dataset.cardId);
    });
  });
  /* 工具栏总开关 */
  spInitToggles();
  /* 收藏标签筛选条 */
  spBuildFavTagPills();
  /* 应用隐藏/已读初始状态到筛选 */
  if(window.spReapply)spReapply();
}
/* 包装 spReapply：筛选后追加收藏标签命中计算 */
(function(){
  var _orig=window.spReapply||function(){};
  window.spReapply=function(){_orig();spApplyFavTagFilter();};
})();
/* ===== 复制外部链接（Crunchbase/官网）：原地不动，避免开一堆新标签 ===== */
function spCopyLink(e,url,label){
  if(e&&e.preventDefault)e.preventDefault();
  var ok=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url);ok=true;} }catch(_){}
  if(!ok){ try{ var ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';ta.style.top='0';ta.style.left='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);ok=true;}catch(_){} }
  spToast(ok?('已复制'+label+'链接，可粘贴打开'):('复制失败，链接：'+url));
  return false;
}
var _spToastTimer=null;
function spToast(msg){
  var t=document.getElementById('sp-toast');
  if(!t){t=document.createElement('div');t.id='sp-toast';t.className='sp-toast';document.body.appendChild(t);}
  t.textContent=msg;t.classList.add('show');
  if(_spToastTimer)clearTimeout(_spToastTimer);
  _spToastTimer=setTimeout(function(){t.classList.remove('show');},1900);
}

if(document.readyState!=='loading'){spInitFav();}else{document.addEventListener('DOMContentLoaded',spInitFav);}
</script>
